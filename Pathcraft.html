function renderLibrary(){return `${header('A library with a direction.','Search the whole curriculum, inspect prerequisites, or go straight to a task you are ready to attempt.',smallButton('+ Add a topic','new-topic'))}<div class="filters"><div class="field search-field"><label for="library-search">Search topics</label><input id="library-search" type="search" placeholder="Try DNS, rollback, GPU, permissions…" value="${esc(filters.query)}"></div><div class="field"><label for="library-branch">Branch</label><select id="library-branch"><option value="all">All branches</option>${seed.branches.map(b=>`<option value="${b.id}" ${filters.branch===b.id?'selected':''}>${b.name}</option>`).join('')}</select></div><div class="field"><label for="library-level">Level</label><select id="library-level"><option value="target" ${filters.level==='target'?'selected':''}>Through target level</option><option value="all" ${filters.level==='all'?'selected':''}>Every level</option>${seed.levels.map(l=>`<option value="${l.id}" ${String(l.id)===filters.level?'selected':''}>L${l.id} · ${l.short}</option>`).join('')}</select></div><div class="field"><label for="library-status">Status</label><select id="library-status"><option value="all">All statuses</option>${E.statuses.map(s=>`<option value="${s}" ${filters.status===s?'selected':''}>${label(s)}</option>`).join('')}</select></div><label class="toggle-check"><input type="checkbox" id="library-ready" ${filters.ready?'checked':''}>Ready only</label></div><div id="library-results">${libraryResults()}</div>`;}
function libraryResults(){const ts=filteredTopics();return `<p class="count-note">${ts.length} topics shown · ${ts.filter(t=>verified(t.id)).length} verified · Optional topics are labelled and remain searchable.</p><div class="library-list">${ts.map(t=>{const b=branch(t.branch);return `<div class="topic-row" style="--branch:${b.color}"><button class="check-circle ${verified(t.id)?'checked':''}" data-action="quick-check" data-id="${t.id}" aria-label="${verified(t.id)?'Unmark':'Verify'} ${esc(t.title)}">${verified(t.id)?'✓':''}</button><button class="topic-row-main" data-action="topic" data-id="${t.id}"><strong>${esc(t.title)}</strong><small><span class="branch-dot"></span>${b.name}<span>· L${t.level} · ${t.id}</span>${t.optional?'<span class="pill">Optional / role-specific</span>':''}</small></button><span class="row-duration muted" style="font-size:10px">${t.minutes} min</span>${statusPill(t)}</div>`;}).join('')||'<div class="empty"><h3>No matching topics</h3><p>Try a broader search, another level or a different status.</p></div>'}</div>`;}
function renderProject(){return `${header('One project. Growing capability.','The roadmap itself is your project. Checkpoint evidence helps you decide when to expand your applications.')}<div class="project-banner"><span class="project-symbol">&lt;/&gt;</span><div><h3>Pathcraft · your infrastructure lab</h3><p>Serve → containerise → deploy → automate → monitor → recover. Keep your lab changes and evidence in one repository.</p></div></div>${seed.checkpoints.map(g=>{const checked=g.checks.filter((_,i)=>state.gates[g.id]?.[i]).length,s=E.stats(g.required.map(topic),state);return `<section class="gate"><div class="gate-number">0${g.level}</div><div><span class="eyebrow">LEVEL ${g.level} CHECKPOINT</span><h3>${g.title}</h3><p>${g.description}</p><div class="check-list">${g.checks.map((c,i)=>`<label><input type="checkbox" data-gate="${g.id}" data-index="${i}" ${state.gates[g.id]?.[i]?'checked':''}><span>${esc(c)}</span></label>`).join('')}</div><div class="gate-footer"><span>${checked}/${g.checks.length} demonstrations · ${s.done}/${s.total} key topic checks</span><span class="pill ${checked===g.checks.length?'verified':''}">${checked===g.checks.length?'Demonstrated':'In progress'}</span></div><details style="margin-top:15px"><summary class="text-button">Key prerequisites</summary><div class="prereq-list" style="margin-top:12px">${g.required.map(id=>prereqChip(id)).join('')}</div></details></div></section>`;}).join('')}<div class="notice">Checkpoints are separate from topic progress. Verify them through demonstrations; checking a box does not claim employment experience or guarantee a role. Optional hardware and cloud labs may cost money.</div>`;}
function renderCareer(){const stages=['Saved','Applied','Interview','Offer','Closed'];return `${header('Start conversations. Keep learning.','Track eligible paid roles while your skills develop. Keep every application honest and specific.',smallButton('+ Add an opportunity','new-job'))}<div class="stats-row">${stages.slice(0,4).map(s=>`<div class="stat"><div class="stat-top">${s}</div><strong>${state.jobs.filter(j=>j.stage===s).length}</strong><small>Recorded opportunities</small></div>`).join('')}</div><div class="notice">Your first target: Linux/application support, operations trainee and junior sysadmin opportunities that match your evidence. Check location, eligibility, actual work and take-home living costs.</div><div class="job-list">${state.jobs.map(j=>`<article class="job-card"><div class="job-card-top"><span class="eyebrow">${esc(j.company)}</span><span class="pill">${esc(j.stage)}</span></div><h3>${esc(j.role)}</h3><span class="muted" style="font-size:11px">${esc(j.location||'Location not recorded')}${j.followup?' · Follow up '+esc(j.followup):''}</span>${j.notes?`<p>${esc(j.notes)}</p>`:''}<div class="job-card-bottom">${E.safeUrl(j.url)?`<a href="${esc(E.safeUrl(j.url))}" target="_blank" rel="noopener noreferrer" class="text-button">Open listing ↗</a>`:'<span></span>'}<button class="text-button" data-action="edit-job" data-id="${esc(j.id)}">Edit opportunity</button></div></article>`).join('')||'<div class="empty" style="grid-column:1/-1"><h3>Your next opportunity goes here.</h3><p>Add a real listing, record what it requires, and choose a next action. No sample jobs are mixed into your records.</p></div>'}</div><div class="section-head"><h2>Prepare your evidence</h2></div><div class="topic-grid">${state.topics.filter(t=>t.branch==='career').slice(0,3).map(topicCard).join('')}</div>`;}
function formatDate(s){const d=new Date(s);return Number.isNaN(d.getTime())?'Unknown date':d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function renderActivity(){const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const date=d.toLocaleDateString('en-CA');return {date,label:d.toLocaleDateString(undefined,{weekday:'short'}),mins:Math.round(state.sessions.filter(s=>new Date(s.at).toLocaleDateString('en-CA')===date).reduce((a,b)=>a+b.minutes,0))};}),max=Math.max(30,...days.map(d=>d.mins));return `${header('Progress leaves a trail.','A record of practice and verified work. Missing a day does not create catch-up debt.')}<div class="two-col"><div class="panel"><h3>Timer minutes · last 7 days</h3><div class="activity-bars">${days.map(d=>`<div class="activity-bar"><span>${d.mins}</span><div class="bar ${d.mins?'has-data':''}" style="height:${Math.max(3,d.mins/max*65)}px"></div><span>${d.label}</span></div>`).join('')}</div><p class="resource-note">Timer duration is self-tracked practice, not a measurement of attention or mastery.</p></div><div class="panel"><span class="eyebrow">YOUR WORK SO FAR</span><h2 style="margin:12px 0">${state.topics.filter(t=>verified(t.id)).length} verified topics</h2><p class="muted" style="font-size:12px">${state.sessions.length} recorded sessions · ${state.jobs.length} opportunities · ${state.topics.filter(t=>status(t.id)==='review').length} topics to revisit</p></div></div><div class="section-head"><h2>Recent activity</h2></div><div class="panel">${state.activity.slice(-60).reverse().map(a=>`<div class="activity-item"><span class="activity-dot"></span><div><p>${esc(a.text)}</p><small>${esc(formatDate(a.at))}</small></div></div>`).join('')||'<div class="empty"><h3>A fresh start.</h3><p>Topic updates, recorded sessions and application changes will appear here.</p></div>'}</div>`;}
function readSync(){try{return JSON.parse(localStorage.getItem(SYNC_KEY)||'{}')}catch{return {};}}
function renderSettings(){const sync=readSync();return `${header('Make this workspace yours.','Your notes, edits and progress belong to you. Keep a portable backup.')}<div class="settings-grid"><section class="panel"><h3>Learning preferences</h3><div class="field"><label for="pref-name">Your name</label><input id="pref-name" maxlength="60" value="${esc(state.prefs.name)}"></div><div class="field"><label for="pref-target">Current target</label><select id="pref-target">${seed.levels.map(l=>`<option value="${l.id}" ${state.prefs.target===l.id?'selected':''}>L${l.id} · ${l.name}</option>`).join('')}</select></div><label class="toggle-check"><input id="pref-optional" type="checkbox" ${state.prefs.includeOptional?'checked':''}>Include optional topics in current-path statistics</label><p>Optional and employer-specific topics remain searchable either way. Level-based percentages count checks, not employability.</p>${smallButton('Save preferences','save-preferences')}</section><section class="panel"><h3>Backup and move devices</h3><p>Progress is saved to this browser and site address. Another browser, localhost port or hosted address has separate storage. Export on one device and import on another to carry your workspace.</p><div class="heading-actions">${smallButton('Download JSON backup','export')}${smallButton('Import backup','import')}</div><div class="notice">Backups contain topic edits, notes, evidence, checkpoint checks, jobs and session history. They do not include cloud credentials.</div>${!storageOk?`<p class="form-error">${esc(loadError||'Local saving is unavailable. Export changes before leaving.')}</p>${smallButton('Download previous raw data','raw-export')}${smallButton('Enable saving after backup','enable-storage')}`:''}</section><section class="panel"><h3>Optional cloud backup</h3><p>Use your own Supabase Free project to move the complete workspace between devices. Push and restore are explicit actions, so one device cannot silently overwrite another. Setup instructions and SQL are in the source package.</p><div class="field"><label for="sync-url">Supabase project URL</label><input id="sync-url" type="url" placeholder="https://your-project.supabase.co" value="${esc(sync.url||'')}"></div><div class="field"><label for="sync-key">Publishable key (never a secret key)</label><input id="sync-key" autocomplete="off" placeholder="sb_publishable_…" value="${esc(sync.key||'')}"></div><div class="heading-actions">${smallButton('Save connection','sync-config')}${smallButton('Sign in with GitHub','sync-login')}${smallButton('Push backup','sync-push')}${smallButton('Restore cloud backup','sync-pull')}${smallButton('Sign out','sync-logout')}</div><div id="sync-status" class="sync-state">${sync.session?'A sign-in session is stored. Cloud operations still need the configured table and access policies.':'Not connected. Local progress works without cloud setup.'}</div><div class="notice">Hosting this page alone does not synchronise progress. Cloud setup needs HTTPS or localhost, GitHub sign-in configuration and the supplied access policies. Free-plan limits and inactivity pausing apply.</div></section><section class="panel"><h3>About this curriculum</h3><p>${state.topics.length} editable topics across ${seed.branches.length} branches. Content edition ${seed.updated}. Every 30-minute node is an initial attempt; larger labs use continuation sessions.</p><ul class="details-list"><li>Use a topic's exact search phrase to find the relevant section of its linked documentation.</li><li>Learn with a short explanation, then do the task and verify the result.</li><li>Use AI for hints and review; independently demonstrate your work.</li><li>Cloud/GPU labs may require paid resources. Local practice remains available.</li><li>Reference frameworks: RHCSA, AWS CloudOps, CNCF, Google SRE, NVIDIA and vLLM documentation.</li></ul><hr class="divider"><h3>Keyboard shortcuts</h3><p><kbd>/</kbd> Search topics · <kbd>Esc</kbd> Close an open panel</p>${smallButton('View all topics','all-topics')}</section></div>`;}
function prereqChip(id){const t=topic(id);return t?`<button class="chip ${verified(id)?'done':''}" data-action="topic" data-id="${esc(id)}">${verified(id)?'✓':'○'} ${esc(id)} · ${esc(t.title)}</button>`:'';}
function openTopic(id,persist=true){const t=topic(id);if(!t)return;selected=id;state.lastTopic=id;if(persist)save();const b=branch(t.branch),p=pstate(id),missing=t.requires.filter(r=>!verified(r)),next=state.topics.filter(n=>n.requires.includes(id));const d=$('#topic-drawer');d.innerHTML=`<div class="drawer-top"><span class="eyebrow">${esc(b.name)} / ${esc(t.id)}</span><div><button class="icon-button" data-action="edit-topic" data-id="${id}" aria-label="Edit topic">${icon('edit')}</button><button class="icon-button" data-action="close-topic" aria-label="Close topic">${icon('close')}</button></div></div><div class="drawer-content"><div class="topic-meta"><span class="pill">Level ${t.level} · ${level(t.level).short}</span><span class="pill">${esc(t.depth)}</span>${t.optional?'<span class="pill">Optional / role-specific</span>':''}<span>${t.minutes} min attempt</span></div><h2 id="drawer-title">${esc(t.title)}</h2><div class="drawer-actions"><button class="button" data-action="focus" data-id="${id}">${icon('clock')} Start a focus block</button><label class="sr-label" for="topic-status" style="position:absolute;width:1px;height:1px;overflow:hidden">Topic status</label><select id="topic-status" data-id="${id}">${E.statuses.map(s=>`<option value="${s}" ${p.status===s?'selected':''}>${label(s)}</option>`).join('')}</select></div><p class="intro">${esc(t.explanation)}</p><section class="drawer-section"><h3>Before you start</h3><div class="prereq-list">${t.requires.length?t.requires.map(prereqChip).join(''):'<span class="muted" style="font-size:12px">No required topic checks. You can start here.</span>'}</div>${missing.length?`<p class="resource-note">${missing.length} prerequisite checks remain. You can still explore or prove existing knowledge.</p>`:''}${t.helpful?.length?`<p class="resource-note">Helpful, not required:</p><div class="prereq-list">${t.helpful.map(prereqChip).join('')}</div>`:''}</section><section class="drawer-section"><h3>01 / Do one thing</h3><div class="task-box">${esc(t.task)}</div></section><section class="drawer-section"><h3>02 / Verify the result</h3><div class="proof-box">${esc(t.proof)}</div><p class="resource-note">Mark verified when you can demonstrate this independently. Documentation is allowed.</p></section><section class="drawer-section"><h3>03 / A little further</h3><p style="font-size:12px">${esc(t.challenge)}</p></section><section class="drawer-section"><h3>Your resource</h3>${E.safeUrl(t.resourceUrl)?`<a class="resource-link" href="${esc(E.safeUrl(t.resourceUrl))}" target="_blank" rel="noopener noreferrer">${esc(t.resourceTitle||'Documentation')} ↗<small>Look for: ${esc(t.sourceSection||t.title)}</small></a>`:'<p class="muted" style="font-size:12px">Add a resource using Edit topic.</p>'}<p class="resource-note">Search phrase: <strong>${esc(t.search||t.title)}</strong>. Read the relevant section, not the whole documentation site.</p></section><section class="drawer-section"><h3>Keep your evidence</h3><div class="field"><label for="topic-evidence">What worked? A command result, commit or explanation.</label><textarea id="topic-evidence" data-progress="evidence" data-id="${id}" placeholder="e.g. Commit, observed output, and why it proves the check">${esc(p.evidence)}</textarea></div><div class="field"><label for="topic-notes">Notes and questions</label><textarea id="topic-notes" data-progress="notes" data-id="${id}" placeholder="Keep only what helps you return.">${esc(p.notes)}</textarea></div><div class="field"><label for="topic-next">Exact next action</label><input id="topic-next" data-progress="next" data-id="${id}" value="${esc(p.next)}" placeholder="Next: inspect the upstream port in the proxy config"></div><p class="resource-note">Saved as you type on this browser.</p></section><section class="drawer-section"><h3>Unlocks next</h3><div class="prereq-list">${next.length?next.map(n=>prereqChip(n.id)).join(''):'<span class="muted" style="font-size:12px">This is a leaf in the current map. Add a related topic when useful.</span>'}</div></section><div class="notice">${esc(t.lab)} One attempt is not a deadline; continue in another block when needed.</div></div><div class="drawer-footer">${smallButton('Edit this topic','edit-topic',`data-id="${id}"`)}<button class="button" data-action="verify-topic" data-id="${id}">${verified(id)?'Mark for revisit':'I passed this check'} ${icon('check')}</button></div>`;if(!d.open)d.showModal();d.scrollTop=0;}
function changeStatus(id,s){pstate(id).status=s;pstate(id).updatedAt=new Date().toISOString();log(`${label(s)}: ${topic(id).title}`);save();render();}
function closeTopic(){$('#topic-drawer').close();selected=null;}
function openEditor(id){const existing=topic(id),t=existing||{id:'U'+Date.now().toString(36).toUpperCase(),title:'',branch:filters.branch!=='all'?filters.branch:'linux',level:state.prefs.target,minutes:30,depth:'Practice',requires:[],helpful:[],explanation:'',task:'',proof:'',challenge:'Change one condition and verify your prediction.',resourceTitle:'',resourceUrl:'',search:'',sourceSection:'',lab:'Local disposable environment. Use synthetic data.',optional:false};const fields=[['title','Title'],['requires','Required topic IDs, separated by commas'],['helpful','Helpful topic IDs, separated by commas'],['resourceTitle','Resource label'],['resourceUrl','Resource URL'],['sourceSection','Relevant section'],['search','Search phrase']];const d=$('#editor-dialog');d.innerHTML=`<div class="modal-header"><h2 id="editor-title">${existing?'Edit topic':'Add a topic'}</h2><button class="icon-button" data-action="close-editor" aria-label="Close editor">${icon('close')}</button></div><form id="topic-form" data-id="${t.id}"><div class="form-grid"><div class="field span-2"><label for="edit-title">Title</label><input id="edit-title" name="title" required maxlength="250" value="${esc(t.title)}"></div><div class="field"><label for="edit-branch">Branch</label><select name="branch" id="edit-branch">${seed.branches.map(b=>`<option value="${b.id}" ${t.branch===b.id?'selected':''}>${b.name}</option>`).join('')}</select></div><div class="field"><label for="edit-level">Level</label><select name="level" id="edit-level">${seed.levels.map(l=>`<option value="${l.id}" ${t.level===l.id?'selected':''}>L${l.id} · ${l.short}</option>`).join('')}</select></div><div class="field"><label for="edit-minutes">Attempt minutes</label><input name="minutes" id="edit-minutes" type="number" min="5" max="90" value="${t.minutes}"></div><div class="field"><label for="edit-depth">Depth</label><select name="depth" id="edit-depth">${['Explain','Practice','Troubleshoot','Design'].map(s=>`<option ${t.depth===s?'selected':''}>${s}</option>`).join('')}</select></div>${fields.slice(1).map(([k,l])=>`<div class="field ${['requires','helpful'].includes(k)?'span-2':''}"><label for="edit-${k}">${l}</label><input id="edit-${k}" name="${k}" ${k==='resourceUrl'?'type="url"':''} value="${esc(Array.isArray(t[k])?t[k].join(', '):t[k])}"></div>`).join('')}${[['explanation','Short explanation'],['task','Practical task'],['proof','Pass check'],['challenge','Small challenge'],['lab','Lab requirements / cost notes']].map(([k,l])=>`<div class="field span-2"><label for="edit-${k}">${l}</label><textarea name="${k}" id="edit-${k}" ${['task','proof'].includes(k)?'required':''}>${esc(t[k])}</textarea></div>`).join('')}<label class="toggle-check span-2"><input name="optional" type="checkbox" ${t.optional?'checked':''}>Optional / employer-specific topic</label><p class="resource-note span-2">Topic ID: ${t.id}. Use the library to find prerequisite IDs. Changes are checked for missing links and dependency cycles.</p><p id="editor-error" class="form-error span-2" role="alert"></p></div><div class="form-actions">${existing?(seed.topics.some(x=>x.id===id)?smallButton('Restore original content','restore-topic',`data-id="${id}"`):`<button type="button" class="button danger compact" data-action="delete-topic" data-id="${id}">Delete custom topic</button>`):''}<button type="button" class="button secondary" data-action="close-editor">Cancel</button><button class="button" type="submit">Save topic</button></div></form>`;d.querySelectorAll('button[data-action]').forEach(b=>b.type='button');d.showModal();}
function saveTopic(form){const fd=new FormData(form),id=form.dataset.id;const t={id,...Object.fromEntries(fd.entries())};t.level=Number(t.level);t.minutes=Number(t.minutes);t.optional=fd.has('optional');t.requires=String(t.requires||'').split(/[\s,]+/).filter(Boolean);t.helpful=String(t.helpful||'').split(/[\s,]+/).filter(Boolean);if(t.resourceUrl&&!E.safeUrl(t.resourceUrl)){$('#editor-error').textContent='Use an http or https resource URL.';return;}const draft=E.clone(state),index=draft.topics.findIndex(x=>x.id===id);if(index<0)draft.topics.push(t);else draft.topics[index]=t;try{state=E.sanitize(draft,seed);log(`${index<0?'Added':'Edited'} topic: ${t.title}`);save();$('#editor-dialog').close();render();openTopic(id);toast('Topic saved. Prerequisite links updated.');}catch(e){$('#editor-error').textContent=e.message;}}
function remaining(){if(!state.timer)return 0;return state.timer.running?Math.max(0,Math.ceil((state.timer.deadline-Date.now())/1000)):state.timer.remaining;}
function timeText(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function finishTimer(show=true){const t=state.timer;if(!t)return;const minutes=Math.round((t.duration-remaining())/60*10)/10;if(minutes>=.1){state.sessions.push({topic:t.topic,minutes,at:new Date().toISOString()});log(`Recorded ${minutes} timer minutes: ${topic(t.topic).title}`);}state.timer=null;save();$('#focus-dialog').close();render();if(show)toast('Session recorded. Progress is verified separately.');}
function focusTopic(id){if(state.timer&&state.timer.topic!==id){if(!confirm('Record the current timer and start a block for this topic?'))return;finishTimer(false);}if(!state.timer)state.timer={topic:id,duration:1500,remaining:1500,running:false,deadline:null};if(status(id)==='planned'){pstate(id).status='learning';log('Started practising: '+topic(id).title);}state.lastTopic=id;save();render();renderFocus();}
function renderFocus(){const t=state.timer;if(!t)return;const n=topic(t.topic),d=$('#focus-dialog');d.innerHTML=`<div class="modal-header"><span class="eyebrow">ONE FOCUSED ATTEMPT</span><button class="icon-button" data-action="close-focus" aria-label="Close focus panel">${icon('close')}</button></div><h2 id="focus-title">${esc(n.title)}</h2><div class="timer" id="focus-time">${timeText(remaining())}</div><div class="timer-controls"><button class="button" data-action="timer-toggle">${t.running?'Pause':'Start timer'}</button>${smallButton('Record & finish','timer-finish')}</div><p class="resource-note">25 minutes to practise, then a few minutes to verify and record.</p><div class="task-box">${esc(n.task)}</div><p style="font-size:12px;text-align:left"><strong>Verify:</strong> ${esc(n.proof)}</p><label for="focus-next" class="resource-note" style="display:block;text-align:left;margin-top:18px">Leave an exact next action before stopping</label><textarea id="focus-next" data-progress="next" data-id="${n.id}" placeholder="Next time, I will…">${esc(pstate(n.id).next)}</textarea>`;if(!d.open)d.showModal();}
function renderTimerBadge(){document.querySelector('.live-timer')?.remove();if(state.timer){const b=document.createElement('button');b.className='live-timer';b.dataset.action='resume-timer';b.textContent='Focus block · '+timeText(remaining());document.body.append(b);}}
setInterval(()=>{if(!state.timer)return;const rem=remaining();if($('#focus-time'))$('#focus-time').textContent=timeText(rem);const b=$('.live-timer');if(b)b.textContent='Focus block · '+timeText(rem);if(state.timer.running&&rem===0){state.timer.running=false;state.timer.remaining=0;state.timer.deadline=null;save();if($('#focus-dialog').open)renderFocus();toast('Block complete. Verify your result and record the next action.');}},1000);
function openJob(id){const j=state.jobs.find(x=>x.id===id)||{id:'job-'+Date.now().toString(36),company:'',role:'',url:'',location:'',stage:'Saved',followup:'',notes:''},d=$('#job-dialog');d.innerHTML=`<div class="modal-header"><h2 id="job-title">${id?'Edit opportunity':'Add an opportunity'}</h2><button class="icon-button" data-action="close-job" aria-label="Close opportunity editor">${icon('close')}</button></div><form id="job-form" data-id="${esc(j.id)}"><div class="form-grid">${[['company','Company'],['role','Role'],['location','Location / work mode'],['url','Listing URL']].map(([k,l])=>`<div class="field"><label for="job-${k}">${l}</label><input name="${k}" id="job-${k}" ${['company','role'].includes(k)?'required':''} ${k==='url'?'type="url"':''} value="${esc(j[k])}"></div>`).join('')}<div class="field"><label for="job-stage">Stage</label><select id="job-stage" name="stage">${['Saved','Applied','Interview','Offer','Closed'].map(s=>`<option ${s===j.stage?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="job-followup">Follow-up date</label><input id="job-followup" name="followup" type="date" value="${esc(j.followup)}"></div><div class="field span-2"><label for="job-notes">Requirements, evidence and next action</label><textarea id="job-notes" name="notes">${esc(j.notes)}</textarea></div></div><div class="form-actions">${id?`<button type="button" class="button danger compact" data-action="delete-job" data-id="${esc(id)}">Delete</button>`:''}<button class="button" type="submit">Save opportunity</button></div></form>`;d.showModal();}
function download(name,text,type='application/json'){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function snapshot(){const s=E.clone(state);s.timer=null;return s;}
function exportBackup(prefix='Pathcraft-backup'){download(`${prefix}-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(snapshot(),null,2));toast('Workspace backup downloaded.');}
function applyImport(parsed,source){const clean=E.sanitize(parsed,seed);if(!confirm(`Replace this workspace with ${source}? A backup of the current workspace will download first.`))return;exportBackup('Pathcraft-before-restore');try{localStorage.setItem(KEY+'.previous',JSON.stringify(state));}catch{}state=clean;state.timer=null;storageOk=true;log('Restored workspace from '+source);save();view='overview';location.hash='overview';render();toast('Workspace restored, including edits and progress.');}
async function syncRequest(path,options={}){const c=readSync();if(!c.url||!c.key)throw Error('Save your Supabase URL and publishable key first.');const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),15000);try{const headers={apikey:c.key,'Content-Type':'application/json',...(options.headers||{})};if(c.session?.access_token)headers.Authorization='Bearer '+c.session.access_token;const res=await fetch(c.url+path,{...options,headers,signal:controller.signal});const text=await res.text();let result;try{result=text?JSON.parse(text):null;}catch{result=null;}if(!res.ok)throw Error(result?.msg||result?.message||result?.error_description||`Cloud request failed (${res.status}). Check setup and sign in again if needed.`);return result;}finally{clearTimeout(timeout);}}
function saveSync(c){localStorage.setItem(SYNC_KEY,JSON.stringify(c));}
async function cloudUser(){let c=readSync();if(!c.session)throw Error('Sign in with GitHub first.');if(c.session.expires_at&&c.session.expires_at<Date.now()+60000&&c.session.refresh_token){const s=await syncRequest('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:c.session.refresh_token})});c=readSync();c.session={...s,expires_at:Date.now()+(s.expires_in||3600)*1000};saveSync(c);}return syncRequest('/auth/v1/user');}
async function cloudPush(){const user=await cloudUser(),rows=await syncRequest('/rest/v1/workspace_backups?user_id=eq.'+encodeURIComponent(user.id)+'&select=revision'),row=rows?.[0],c=readSync();if(row&&row.revision!==(c.seenRevision||0))throw Error('Cloud has a version this browser has not restored. Export local work, then restore cloud before pushing to avoid overwriting another device.');let result;if(row){result=await syncRequest('/rest/v1/workspace_backups?user_id=eq.'+encodeURIComponent(user.id)+'&revision=eq.'+row.revision,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({data:snapshot(),revision:row.revision+1,updated_at:new Date().toISOString()})});if(!result?.length)throw Error('Cloud changed during saving. Restore its latest version before retrying.');}else result=await syncRequest('/rest/v1/workspace_backups',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({user_id:user.id,data:snapshot(),revision:1,updated_at:new Date().toISOString()})});c.seenRevision=result[0].revision;saveSync(c);toast('Cloud backup saved. Restore it explicitly on another device.');}
async function cloudPull(){const user=await cloudUser(),rows=await syncRequest('/rest/v1/workspace_backups?user_id=eq.'+encodeURIComponent(user.id)+'&select=data,revision');if(!rows?.length)throw Error('No cloud backup yet. Push one from the browser containing your progress.');const clean=E.sanitize(rows[0].data,seed);if(!confirm('Restore the cloud workspace? Your current local workspace will download as a backup first.'))return;exportBackup('Pathcraft-before-cloud-restore');state=clean;state.timer=null;const c=readSync();c.seenRevision=rows[0].revision;saveSync(c);log('Restored workspace from cloud backup');save();render();toast('Cloud workspace restored.');}
async function syncAction(action){try{if(action==='sync-config'){const url=$('#sync-url').value.trim().replace(/\/$/,''),key=$('#sync-key').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url))throw Error('Use the HTTPS project URL supplied by Supabase.');if(!/^sb_publishable_[A-Za-z0-9_-]+$/.test(key))throw Error('Use a publishable key starting sb_publishable_. Never enter a secret or service-role key.');const old=readSync();saveSync({url,key,...(old.url===url?{session:old.session,seenRevision:old.seenRevision}:{})});toast('Connection saved. Configure the supplied SQL and GitHub provider before sign-in.');}
 if(action==='sync-login'){const c=readSync();if(!c.url||!c.key)throw Error('Save the connection first.');if(location.protocol==='file:')throw Error('Start localhost or host the page to use sign-in. File URLs cannot receive this callback.');const redirect=location.origin+location.pathname;location.href=c.url+'/auth/v1/authorize?provider=github&redirect_to='+encodeURIComponent(redirect);}
 if(action==='sync-push')await cloudPush();if(action==='sync-pull')await cloudPull();if(action==='sync-logout'){const c=readSync();try{if(c.session)await syncRequest('/auth/v1/logout',{method:'POST'});}catch{}delete c.session;saveSync(c);toast('Signed out. Local work is unchanged.');}if(view==='settings')render();}catch(e){toast(e.name==='AbortError'?'Cloud request timed out. Your local work remains saved.':e.message);if($('#sync-status'))$('#sync-status').textContent=e.message;}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='navigate'){navigate(b.dataset.view);return;}if(a==='topic'){openTopic(id);return;}if(a==='close-topic'){closeTopic();return;}if(a==='theme'){state.prefs.theme=state.prefs.theme==='light'?'dark':'light';save();render();return;}if(a==='menu'){const side=$('#sidebar');side.classList.toggle('open');return;}if(a==='export'){exportBackup();return;}if(a==='import'){$('#import-file').click();return;}if(a==='search'){filters={query:'',branch:'all',level:'all',status:'all',ready:false};navigate('library');$('#library-search').focus();return;}if(a==='all-topics'){filters={query:'',branch:'all',level:'all',status:'all',ready:false};navigate('library');return;}if(a==='ready-list'){filters={query:'',branch:'all',level:'target',status:'all',ready:true};navigate('library');return;}if(a==='target'){state.prefs.target=Number(b.dataset.level);save();render();return;}if(a==='choose-target'){navigate('roadmap');return;}if(a==='branch'){mapBranch=b.dataset.branch;mapMode='graph';filters.level='target';zoom=1;render();return;}if(a==='map-mode'){mapMode=b.dataset.mode;render();return;}if(a==='branch-list'){filters={query:'',branch:mapBranch,level:filters.level,status:'all',ready:false};navigate('library');return;}if(a==='zoom'){zoom=Math.max(.5,Math.min(1.7,zoom+Number(b.dataset.delta)));applyZoom();return;}if(a==='zoom-reset'){zoom=1;applyZoom();return;}if(a==='quick-check'){changeStatus(id,verified(id)?'planned':'verified');toast(verified(id)?'Marked verified. Add your evidence in the topic.':'Topic returned to not started.');return;}if(a==='verify-topic'){changeStatus(id,verified(id)?'review':'verified');openTopic(id);return;}if(a==='new-topic'){openEditor();return;}if(a==='edit-topic'){openEditor(id);return;}if(a==='close-editor'){$('#editor-dialog').close();return;}if(a==='restore-topic'){if(confirm('Restore the original topic content? Your notes and progress stay.')){const i=state.topics.findIndex(t=>t.id===id);const candidate=E.clone(state);candidate.topics[i]=E.clone(seed.topics.find(t=>t.id===id));try{state=E.sanitize(candidate,seed);save();$('#editor-dialog').close();render();openTopic(id);}catch(err){$('#editor-error').textContent=err.message;}}return;}if(a==='delete-topic'){const dependents=state.topics.filter(t=>t.requires.includes(id)||t.helpful?.includes(id));if(dependents.length){$('#editor-error').textContent='Remove references from '+dependents.map(t=>t.id).join(', ')+' first.';return;}if(confirm('Delete this custom topic and its notes?')){state.topics=state.topics.filter(t=>t.id!==id);delete state.progress[id];if(state.timer?.topic===id)state.timer=null;state.sessions=state.sessions.filter(s=>s.topic!==id);if(state.lastTopic===id)state.lastTopic=null;save();$('#editor-dialog').close();closeTopic();render();}return;}if(a==='focus'){focusTopic(id);return;}if(a==='close-focus'){$('#focus-dialog').close();return;}if(a==='resume-timer'){renderFocus();return;}if(a==='timer-toggle'){const t=state.timer;if(t.running){t.remaining=remaining();t.running=false;t.deadline=null;}else{if(t.remaining<=0)t.remaining=t.duration;t.running=true;t.deadline=Date.now()+t.remaining*1000;}save();renderFocus();renderTimerBadge();return;}if(a==='timer-finish'){finishTimer();return;}if(a==='new-job'){openJob();return;}if(a==='edit-job'){openJob(id);return;}if(a==='close-job'){$('#job-dialog').close();return;}if(a==='delete-job'){if(confirm('Delete this opportunity?')){state.jobs=state.jobs.filter(j=>j.id!==id);save();$('#job-dialog').close();render();}return;}if(a==='save-preferences'){state.prefs.name=$('#pref-name').value.trim().slice(0,60)||'Mohit';state.prefs.target=Number($('#pref-target').value);state.prefs.includeOptional=$('#pref-optional').checked;save();render();toast('Preferences saved.');return;}if(a==='raw-export'){try{download('Pathcraft-previous-raw.json',localStorage.getItem(KEY)||'{}');}catch{toast('Browser storage cannot be read.');}return;}if(a==='enable-storage'){if(confirm('Allow this workspace to replace the saved data after you have backed it up?')){storageOk=true;save();render();}return;}if(a.startsWith('sync-')){syncAction(a);return;}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='library-search'){filters.query=el.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{if($('#library-results'))$('#library-results').innerHTML=libraryResults();},100);}if(el.dataset.progress){const p=pstate(el.dataset.id);p[el.dataset.progress]=el.value.slice(0,20000);p.updatedAt=new Date().toISOString();save();}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='library-branch')filters.branch=el.value;if(el.id==='library-level')filters.level=el.value;if(el.id==='library-status')filters.status=el.value;if(el.id==='library-ready')filters.ready=el.checked;if(['library-branch','library-level','library-status','library-ready'].includes(el.id))$('#library-results').innerHTML=libraryResults();if(el.id==='graph-branch'){mapBranch=el.value;zoom=1;render();}if(el.id==='graph-scope'){filters.level=el.value;render();}if(el.id==='topic-status'){changeStatus(el.dataset.id,el.value);openTopic(el.dataset.id);}if(el.dataset.gate){state.gates[el.dataset.gate]||={};state.gates[el.dataset.gate][el.dataset.index]=el.checked;log((el.checked?'Demonstrated':'Reopened')+' a Level '+seed.checkpoints.find(g=>g.id===el.dataset.gate).level+' checkpoint item');save();render();}});
document.addEventListener('submit',e=>{if(e.target.id==='topic-form'){e.preventDefault();saveTopic(e.target);}if(e.target.id==='job-form'){e.preventDefault();const j={id:e.target.dataset.id,...Object.fromEntries(new FormData(e.target).entries()),updatedAt:new Date().toISOString()};j.url=E.safeUrl(j.url);const i=state.jobs.findIndex(x=>x.id===j.id);if(i<0)state.jobs.push(j);else state.jobs[i]=j;log(`Opportunity ${j.stage.toLowerCase()}: ${j.role} at ${j.company}`);save();$('#job-dialog').close();render();}});
$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>8*1024*1024)throw Error('Backup exceeds the 8 MB import limit.');applyImport(JSON.parse(await file.text()),'the selected backup');}catch(err){toast('Import rejected: '+err.message);}e.target.value='';});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!$('dialog[open]')){e.preventDefault();filters={query:'',branch:'all',level:'all',status:'all',ready:false};navigate('library');$('#library-search').focus();}if(e.key==='Escape')$('#sidebar').classList.remove('open');});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(['overview','roadmap','library','project','career','activity','settings'].includes(v)&&view!==v){view=v;render();}});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const other=E.sanitize(JSON.parse(e.newValue),seed);if(other.updatedAt>state.updatedAt){state=other;render();if(selected&&$('#topic-drawer').open)openTopic(selected,false);}}catch{toast('Another tab saved data that could not be loaded. Export this workspace before continuing.');}}});
// Optional OAuth callback. Tokens remain outside workspace exports.
const auth=new URLSearchParams(location.hash.slice(1));if(auth.has('access_token')){try{const c=readSync();if(c.url&&c.key){c.session={access_token:auth.get('access_token'),refresh_token:auth.get('refresh_token'),expires_at:Date.now()+Number(auth.get('expires_in')||3600)*1000};saveSync(c);}history.replaceState(null,'',location.pathname+location.search+'#settings');view='settings';}catch{history.replaceState(null,'',location.pathname);}}
render();if(loadError)toast(loadError);
})();

</script>
