window.PATHCRAFT_CURRICULUM = {"version":"1.0.0","updated":"2026-11-04","branches":[{"id":"linux","name":"Linux & systems","icon":"terminal","color":"#397b69"},{"id":"network","name":"Networking & web","icon":"network","color":"#4e83be"},{"id":"git","name":"Git & collaboration","icon":"git","color":"#a16a4e"},{"id":"code","name":"Scripting & data","icon":"code","color":"#8d6ab5"},{"id":"ops","name":"Support & reliability","icon":"pulse","color":"#c07c38"},{"id":"docker","name":"Containers","icon":"box","color":"#4b8eaa"},{"id":"aws","name":"AWS & cloud","icon":"cloud","color":"#c18a38"},{"id":"cicd","name":"Delivery pipelines","icon":"workflow","color":"#b26781"},{"id":"iac","name":"Infrastructure as code","icon":"layers","color":"#6874ad"},{"id":"kube","name":"Kubernetes","icon":"hexagon","color":"#5e77be"},{"id":"security","name":"Security","icon":"shield","color":"#568c78"},{"id":"platform","name":"Platform & architecture","icon":"grid","color":"#93718d"},{"id":"ai","name":"AI infrastructure","icon":"spark","color":"#ab6b4e"},{"id":"career","name":"Career & communication","icon":"briefcase","color":"#6b8b52"},{"id":"enterprise","name":"Enterprise extensions","icon":"server","color":"#7c8599"}],"levels":[{"id":1,"name":"Operate & troubleshoot","short":"Support","description":"Build the Linux and support foundation. Start applying when you can demonstrate the checkpoint.","roles":"Linux support · Application support · Operations trainee"},{"id":2,"name":"Deploy & maintain","short":"Cloud","description":"Run a service on cloud infrastructure and recover it when it breaks.","roles":"Cloud support · Cloud operations · Junior infrastructure"},{"id":3,"name":"Automate delivery","short":"DevOps","description":"Make builds, infrastructure and releases repeatable and reviewable.","roles":"Junior DevOps · Automation · Platform trainee"},{"id":4,"name":"Engineer reliability","short":"Platform","description":"Deepen production reliability, scaling, security and technical ownership.","roles":"Platform engineering · SRE · Infrastructure engineering"},{"id":5,"name":"AI infrastructure","short":"AI infra","description":"Choose inference or training infrastructure after the relevant foundations.","roles":"Inference infrastructure · AI platform · ML infrastructure"}],"topics":[{"id":"L01","level":1,"branch":"linux","requires":[],"title":"Paths and filesystem navigation","explanation":"A path identifies a location; relative paths start from your working directory. Linux has one filesystem tree rooted at /.","task":"Navigate a practice directory using pwd, cd and ls. Locate /etc, /var/log and your home directory.","proof":"Explain an absolute and a relative path, then reach the same file with both.","resourceTitle":"GNU Coreutils manual","resourceUrl":"https://www.gnu.org/software/coreutils/manual/coreutils.html","search":"Paths and filesystem navigation","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Paths and filesystem navigation"},{"id":"L02","level":1,"branch":"linux","requires":["L01"],"title":"Safe file operations and inspection","explanation":"cp, mv, mkdir and rm change filesystem entries. Inspect paths before deleting; recursive removal is not a recycle bin.","task":"Create a disposable directory, copy and rename files, then remove only the practice directory.","proof":"Show the resulting tree and explain what was copied versus moved.","resourceTitle":"GNU Coreutils manual","resourceUrl":"https://www.gnu.org/software/coreutils/manual/coreutils.html","search":"Safe file operations and inspection","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Safe file operations and inspection"},{"id":"L03","level":1,"branch":"linux","requires":["L02"],"title":"Text inspection, grep and basic patterns","explanation":"Logs are text streams. Search for evidence with grep; a pattern is different from a literal substring.","task":"Find an error in a sample log using grep, head and tail; compare a literal and a simple regular expression.","proof":"Extract only matching lines and explain why they matched.","resourceTitle":"GNU Coreutils manual","resourceUrl":"https://www.gnu.org/software/coreutils/manual/coreutils.html","search":"Text inspection, grep and basic patterns","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Text inspection, grep and basic patterns"},{"id":"L04","level":1,"branch":"linux","requires":["L03"],"title":"Pipes, redirection and standard error","explanation":"Processes have standard input, output and error streams. A pipe connects output to another process, while redirection writes to a file.","task":"Filter a log into a new file and capture a failing command's standard error separately.","proof":"Demonstrate that errors and normal output went to the intended destinations.","resourceTitle":"GNU Bash manual","resourceUrl":"https://www.gnu.org/software/bash/manual/bash.html","search":"Pipes, redirection and standard error","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Pipes, redirection and standard error"},{"id":"L05","level":1,"branch":"linux","requires":["L02"],"title":"Archives, compression and links","explanation":"Archives bundle files; compression reduces encoded size. A symbolic link stores a path, while a hard link references an inode.","task":"Archive a practice folder; extract elsewhere; create a symbolic and a hard link.","proof":"Compare file contents after restore and explain what happens when a link target is renamed.","resourceTitle":"GNU Coreutils manual","resourceUrl":"https://www.gnu.org/software/coreutils/manual/coreutils.html","search":"Archives, compression and links","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Archives, compression and links"},{"id":"L06","level":1,"branch":"linux","requires":["L01"],"title":"Users, groups and sudo","explanation":"A process acts as a user with group memberships. sudo grants selected elevated actions; it does not justify running every command as root.","task":"Inspect id, groups and sudo permissions in your lab. Create a disposable user if you own the VM.","proof":"Explain your effective identity and when elevation is needed.","resourceTitle":"Linux Upskill Challenge","resourceUrl":"https://linuxupskillchallenge.org/","search":"Users, groups and sudo","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Users, groups and sudo"},{"id":"L07","level":1,"branch":"linux","requires":["L06"],"title":"Ownership, rwx permissions and umask","explanation":"Permissions apply separately to owner, group and others. Directory execute permission means traversal; umask affects newly created permissions.","task":"Reproduce a denied file access in a lab and fix ownership or the minimum permissions.","proof":"Explain the fix without using chmod 777.","resourceTitle":"GNU Coreutils manual","resourceUrl":"https://www.gnu.org/software/coreutils/manual/coreutils.html","search":"Ownership, rwx permissions and umask","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Ownership, rwx permissions and umask"},{"id":"L08","level":1,"branch":"linux","requires":["L01"],"title":"Processes, signals and exit codes","explanation":"A PID identifies a running process. Exit codes communicate success or failure; graceful termination differs from an uncatchable kill.","task":"Start a harmless long-running command, inspect its PID, stop it with TERM and inspect a command's exit code.","proof":"Distinguish a process, a shell job and an exit status.","resourceTitle":"GNU Bash manual","resourceUrl":"https://www.gnu.org/software/bash/manual/bash.html","search":"Processes, signals and exit codes","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Processes, signals and exit codes"},{"id":"L09","level":1,"branch":"linux","requires":["L06"],"title":"Packages and trusted repositories","explanation":"Package managers resolve dependencies and install from configured repositories. Package names and service names can differ.","task":"Inspect package metadata and install a small utility using your distribution's package manager.","proof":"Show its version, package origin and removal command.","resourceTitle":"Linux Upskill Challenge","resourceUrl":"https://linuxupskillchallenge.org/","search":"Packages and trusted repositories","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Packages and trusted repositories"},{"id":"L10","level":1,"branch":"linux","requires":["L08","L09"],"title":"systemd service lifecycle","explanation":"systemd manages units and records their state. Enabled at boot and running now are independent properties.","task":"Inspect a harmless service with systemctl; compare status, start, stop and enable in your own VM.","proof":"Explain active versus enabled and find the service's unit definition.","resourceTitle":"systemd documentation","resourceUrl":"https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html","search":"systemd service lifecycle","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"systemd service lifecycle"},{"id":"L11","level":1,"branch":"linux","requires":["L10","L07"],"title":"A custom systemd unit","explanation":"A service needs a start command, working directory, identity and environment. Relative paths often fail because a service has a different context from your shell.","task":"Write a lab unit for a tiny Python HTTP server using an unprivileged user.","proof":"Start it successfully and show which user and working directory it uses.","resourceTitle":"systemd documentation","resourceUrl":"https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html","search":"A custom systemd unit","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"A custom systemd unit"},{"id":"L12","level":1,"branch":"linux","requires":["L10","L03"],"title":"journalctl and service failure evidence","explanation":"Service status is a summary; journals contain the timeline. Filter by unit and time to avoid unrelated noise.","task":"Give your lab unit an invalid executable path, inspect the journal, then restore it.","proof":"Point to the log entry that explains the failure and verify recovery.","resourceTitle":"systemd documentation","resourceUrl":"https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html","search":"journalctl and service failure evidence","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"journalctl and service failure evidence"},{"id":"L13","level":1,"branch":"linux","requires":["L08"],"title":"CPU, memory and load inspection","explanation":"Load, CPU use and memory pressure measure different things. High load alone does not prove CPU saturation.","task":"Inspect top, free and uptime during an idle and a small controlled workload.","proof":"Explain one measurement and one conclusion it cannot support alone.","resourceTitle":"Linux Upskill Challenge","resourceUrl":"https://linuxupskillchallenge.org/","search":"CPU, memory and load inspection","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"CPU, memory and load inspection"},{"id":"L14","level":1,"branch":"linux","requires":["L01"],"title":"Disk capacity and inode exhaustion","explanation":"Space is limited by both bytes and filesystem entries. A full filesystem can prevent logging or application writes.","task":"Compare df, df -i and du on a practice directory; locate its largest files.","proof":"Explain why df and du can report different totals.","resourceTitle":"GNU Coreutils manual","resourceUrl":"https://www.gnu.org/software/coreutils/manual/coreutils.html","search":"Disk capacity and inode exhaustion","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Disk capacity and inode exhaustion"},{"id":"L15","level":1,"branch":"linux","requires":["L14"],"title":"Block devices, filesystems and mounts","explanation":"A device is not a filesystem, and a filesystem is not a mount point. Mounting makes storage visible at a directory.","task":"Inspect lsblk, findmnt and a read-only view of fstab without modifying system disks.","proof":"Trace one mounted path to its backing device and filesystem.","resourceTitle":"Linux Upskill Challenge","resourceUrl":"https://linuxupskillchallenge.org/","search":"Block devices, filesystems and mounts","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Block devices, filesystems and mounts"},{"id":"L16","level":1,"branch":"linux","requires":["L08"],"title":"Environment variables and shell configuration","explanation":"Environment variables are inherited by child processes. A shell variable is not automatically exported, and interactive startup files may not affect services.","task":"Set and export a test variable; read it from a Python child process.","proof":"Show the difference between shell-local and exported configuration.","resourceTitle":"GNU Bash manual","resourceUrl":"https://www.gnu.org/software/bash/manual/bash.html","search":"Environment variables and shell configuration","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Environment variables and shell configuration"},{"id":"L17","level":1,"branch":"linux","requires":["L10"],"title":"cron and systemd timers","explanation":"Scheduled jobs run with a limited environment. Time zones, paths and overlapping runs are common operational traps.","task":"Schedule a harmless timestamp write in a lab, capture its output and remove the schedule afterward.","proof":"Show the execution evidence and explain how you would prevent overlapping runs.","resourceTitle":"systemd documentation","resourceUrl":"https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html","search":"cron and systemd timers","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"cron and systemd timers"},{"id":"L18","level":1,"branch":"linux","requires":["L15"],"title":"LVM physical, volume and logical groups","explanation":"LVM separates physical capacity from logical volumes. It adds flexibility but still requires filesystem-aware expansion and backups.","task":"Draw a PV → VG → LV layout; inspect a disposable VM's storage or use loopback disks.","proof":"Explain which layer gains capacity during an expansion.","resourceTitle":"Linux Upskill Challenge","resourceUrl":"https://linuxupskillchallenge.org/","search":"LVM physical, volume and logical groups","optional":true,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"LVM physical, volume and logical groups"},{"id":"L19","level":1,"branch":"linux","requires":["L18"],"title":"Filesystem expansion and persistent mounts","explanation":"Growing a logical volume and growing its filesystem are separate operations. A wrong fstab entry can affect boot.","task":"In a disposable VM, expand a practice volume and validate its mount configuration before reboot.","proof":"Verify the new usable size and persistence after restart.","resourceTitle":"Linux Upskill Challenge","resourceUrl":"https://linuxupskillchallenge.org/","search":"Filesystem expansion and persistent mounts","optional":true,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Filesystem expansion and persistent mounts"},{"id":"L20","level":1,"branch":"linux","requires":["L07"],"title":"ACLs and mandatory access controls","explanation":"ACLs add finer file permissions. SELinux and AppArmor can deny access even when Unix permissions allow it.","task":"Inspect an ACL and your system's mandatory-access-control status; read one example denial.","proof":"Identify whether a sample failure belongs to Unix permissions or an additional policy layer.","resourceTitle":"Linux Upskill Challenge","resourceUrl":"https://linuxupskillchallenge.org/","search":"ACLs and mandatory access controls","optional":true,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"ACLs and mandatory access controls"},{"id":"L21","level":1,"branch":"linux","requires":["L10","L15"],"title":"Boot targets and recovery planning","explanation":"Boot depends on firmware, bootloader, kernel, mounts and services. Recovery requires console access and a tested rollback path.","task":"Draw the boot sequence and inspect the current target in a disposable VM.","proof":"Describe how you would investigate a failed mount without altering a live system.","resourceTitle":"systemd documentation","resourceUrl":"https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html","search":"Boot targets and recovery planning","optional":true,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Boot targets and recovery planning"},{"id":"L22","level":2,"branch":"linux","requires":["L11","L16"],"title":"Service configuration and graceful restarts","explanation":"A service's environment and restart policy affect availability. Reload applies supported configuration changes without necessarily restarting the process.","task":"Change a lab service setting and compare a supported reload with restart.","proof":"Explain which process changed and demonstrate the served setting.","resourceTitle":"systemd documentation","resourceUrl":"https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html","search":"Service configuration and graceful restarts","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Service configuration and graceful restarts"},{"id":"L23","level":2,"branch":"linux","requires":["L15","N04"],"title":"Network filesystems and time synchronisation","explanation":"Remote mounts introduce network dependencies. Clock skew can break certificates, authentication and incident timelines.","task":"Inspect time synchronisation and sketch an NFS mount path with its failure points.","proof":"Explain an access failure caused by a mount or clock rather than application code.","resourceTitle":"Linux Upskill Challenge","resourceUrl":"https://linuxupskillchallenge.org/","search":"Network filesystems and time synchronisation","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Network filesystems and time synchronisation"},{"id":"L24","level":4,"branch":"linux","requires":["L13","D17"],"title":"cgroups and namespaces","explanation":"Namespaces isolate views of resources; cgroups account for and limit resource consumption. Containers share the host kernel.","task":"Inspect a container's process namespace and configured memory limit in a lab.","proof":"Explain isolation versus resource limits using observed values.","resourceTitle":"Docker concepts","resourceUrl":"https://docs.docker.com/get-started/docker-concepts/","search":"cgroups and namespaces","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data. This node is an initial focused attempt; full validation may need multiple sessions.","sourceSection":"cgroups and namespaces"},{"id":"L25","level":4,"branch":"linux","requires":["L13","L14"],"title":"File descriptors and process limits","explanation":"Open files and sockets consume descriptors. A process can fail even when CPU and memory look healthy.","task":"Inspect a process's open descriptors and soft/hard limits without changing host-wide settings.","proof":"Explain an example 'too many open files' failure and a safe investigation.","resourceTitle":"Linux Upskill Challenge","resourceUrl":"https://linuxupskillchallenge.org/","search":"File descriptors and process limits","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data. This node is an initial focused attempt; full validation may need multiple sessions.","sourceSection":"File descriptors and process limits"},{"id":"L26","level":4,"branch":"linux","requires":["L13","L24"],"title":"Memory pressure and OOM diagnosis","explanation":"Resident memory, page cache, swap and container limits interact. OOM evidence matters more than repeatedly increasing limits.","task":"Read a recorded OOM event or trigger one only in a tightly limited disposable container.","proof":"Identify whether the host or container limit caused the termination.","resourceTitle":"Linux Upskill Challenge","resourceUrl":"https://linuxupskillchallenge.org/","search":"Memory pressure and OOM diagnosis","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data. This node is an initial focused attempt; full validation may need multiple sessions.","sourceSection":"Memory pressure and OOM diagnosis"},{"id":"L27","level":4,"branch":"linux","requires":["L08","L25"],"title":"System-call and I/O investigation","explanation":"strace reveals system calls; I/O tools show storage pressure. Tracing can add overhead and expose sensitive payloads.","task":"Trace a harmless file-read command and identify open, read and close operations.","proof":"Connect a failed system call to the user-visible error.","resourceTitle":"Linux Upskill Challenge","resourceUrl":"https://linuxupskillchallenge.org/","search":"System-call and I/O investigation","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data. This node is an initial focused attempt; full validation may need multiple sessions.","sourceSection":"System-call and I/O investigation"},{"id":"L28","level":4,"branch":"linux","requires":["L27"],"title":"Profiling and eBPF orientation","explanation":"Profiling samples where time is spent. eBPF enables kernel-level instrumentation but requires appropriate access and interpretation.","task":"Compare a CPU profile and an I/O trace from a documented example.","proof":"Ch onment and change the setting without editing code.","resourceTitle":"Python tutorial","resourceUrl":"https://docs.python.org/3/tutorial/","search":"Python environments and configuration","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Python environments and configuration"},{"id":"C04","level":1,"branch":"code","requires":["C03","N05"],"title":"HTTP health script with timeout","explanation":"An automation script must stop waiting eventually and distinguish network failures from unhealthy responses.","task":"Write a Python health check with a timeout and a nonzero failure exit code.","proof":"Stop the lab service and show a bounded, clear failure.","resourceTitle":"Python tutorial","resourceUrl":"https://docs.python.org/3/tutorial/","search":"HTTP health script with timeout","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"HTTP health script with timeout"},{"id":"C05","level":1,"branch":"code","requires":["C03"],"title":"JSON, YAML and structured data","explanation":"Structured formats encode types and nesting. Parsing is safer than slicing text; YAML indentation can change meaning.","task":"Parse a JSON response and inspect a small YAML service configuration.","proof":"Explain a string versus a number and fix one malformed example.","resourceTitle":"Python tutorial","resourceUrl":"https://docs.python.org/3/tutorial/","search":"JSON, YAML and structured data","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourc ctice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Deployment checks and rollback"},{"id":"CI08","level":3,"branch":"cicd","requires":["CI07","G05"],"title":"Environments, approvals and concurrency","explanation":"Parallel deployments can race. Separate environments and explicit promotion rules make changes easier to control.","task":"Add a deployment concurrency rule and document a production approval boundary.","proof":"Explain which release wins and whether a running deployment is cancelled.","resourceTitle":"GitHub Actions documentation","resourceUrl":"https://docs.github.com/en/actions","search":"Environments, approvals and concurrency","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Environments, approvals and concurrency"},{"id":"CI09","level":3,"branch":"cicd","requires":["CI08"],"title":"Reusable workflows and dependency pinning","explanation":"Shared workflow logic reduces repetition but becomes a dependency. Version and permission choices affect every caller.","task":"Extract a small reusable check and pin external actions to reviewed references.","proof":"Explain how you would update the shared workflow safely.","resourceTitle":"GitHub Actions documentation","resourceUrl":"https://docs.github.com/en/actions","search":"Reusable workflows and dependency pinning","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Reusable workflows and dependency pinning"},{"id":"CI10","level":4,"branch":"cicd","requires":["CI07","O18"],"title":"Rolling, blue-green and canary releases","explanation":"Release strategies trade resource cost, traffic exposure and rollback speed. Database compatibility can constrain all of them.","task":"Draw three release strategies for the same service and choose one for a stated constraint.","proof":"Define the observation and rollback condition for your choice.","resourceTitle":"Google Site Reliability Workbook","resourceUrl":"https://sre.google/workbook/table-of-contents/","search":"Rolling, blue-green and canary releases","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data. This node is an initial focused attempt; full validation may need multiple sessions.","sourceSection":"Rolling, blue-green and canary releases"},{"id":"T01","level":2,"branch":"iac","requires":["D01","L16"],"title":"Terraform provider, resource and init","explanation":"A provider implements resource operations; configuration declares desired resources. State associates configuration with real objects.","task":"Follow a local Docker Terraform tutorial and initialise its provider.","proof":"Identify one provider, one resource and the generated local state location.","resourceTitle":"Terraform tutorials","resourceUrl":"https://developer.hashicorp.com/terraform/tutorials","search":"Terraform provider, resource and init","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Terraform provider, resource and init"},{"id":"T02","level":2,"branch":"iac","requires":["T01"],"title":"Terraform plan, apply and destroy","explanation":"A plan previews changes but external state can still change afterward. Destroy affects managed resources and must be scoped carefully.","task":"Plan, create and remove only a disposable local tutorial resource.","proof":"Predict the change before apply and verify removal afterward.","resourceTitle":"Terraform tutorials","resourceUrl":"https://developer.hashicorp.com/terraform/tutorials","search":"Terraform plan, apply and destroy","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Terraform plan, apply and destroy"},{"id":"T03","level":3,"branch":"iac","requires":["T02"],"title":"Variables, outputs, locals and references","explanation":"Inputs parameterise configuration; outputs expose useful results. References form dependencies between resources.","task":"Parameterise the lab image name and output its identifier.","proof":"Explain how a changed input affects the plan.","resourceTitle":"Terraform tutorials","resourceUrl":"https://developer.hashicorp.com/terraform/tutorials","search":"Variables, outputs, locals and references","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Cloud resources may cost money. Inspect the plan and pricing, use an owned lab, and clean up afterwards. Budget alerts are not spending caps.","sourceSection":"Variables, outputs, locals and references"},{"id":"T04","level":3,"branch":"iac","requires":["T03","G02"],"title":"State, secrets and remote locking","explanation":"State can contain sensitive values. A remote backend and locking coordinate writers but require access control and recovery planning.","task":"Inspect lab state and design a restricted remote backend with locking.","proof":"Explain why deleting state does not delete infrastructure.","resourceTitle":"Terraform tutorials","resourceUrl":"https://developer.hashicorp.com/terraform/tutorials","search":"State, secrets and remote locking","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Cloud resources may cost money. Inspect the plan and pricing, use an owned lab, and clean up afterwards. Budget alerts are not spending caps.","sourceSection":"State, secrets and remote locking"},{"id":"T05","level":3,"branch":"iac","requires":["T04","A04","A07","A02"],"title":"EC2 and security groups as code","explanation":"Infrastructure code should express the environment you already understand. Review replacements and ingress before applying.","task":"Define a small owned EC2 lab with narrow access, then inspect its plan.","proof":"Explain each resource, expected cost and cleanup path.","resourceTitle":"Terraform tutorials","resourceUrl":"https://developer.hashicorp.com/terraform/tutorials","search":"EC2 and security groups as code","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Cloud resources may cost money. Inspect the plan and pricing, use an owned lab, and clean up afterwards. Budget alerts are not spending caps.","sourceSection":"EC2 and security groups as code"},{"id":"T06","level":3,"branch":"iac","requires":["T05"],"title":"Modules and environment separation","explanation":"A module packages related resources. Environments need deliberate state and credential boundaries; naming alone does not isolate them.","task":"Extract a small reusable module and define separate lab inputs.","proof":"Show which state and identity each environment would use.","resourceTitle":"Terraform tutorials","resourceUrl":"https://developer.hashicorp.com/terraform/tutorials","search":"Modules and environment separation","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Cloud resources may cost money. Inspect the plan and pricing, use an owned lab, and clean up afterwards. Budget alerts are not spending caps.","sourceSection":"Modules and environment separation"},{"id":"T07","level":3,"branch":"iac","requires":["T05"],"title":"Drift, import and replacement review","explanation":"Real resources can diverge from configuration. Import establishes management; it does not automatically create complete correct configuration.","task":"Change a harmless lab setting outside Terraform and inspect the next plan.","proof":"Identify drift and any destructive replacement before acting.","resourceTitle":"Terraform tutorials","resourceUrl":"https://developer.hashicorp.com/terraform/tutorials","search":"Drift, import and replacement review","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Cloud resources may cost money. Inspect the plan and pricing, use an owned lab, and clean up afterwards. Budget alerts are not spending caps.","sourceSection":"Drift, import and replacement review"},{"id":"T08","level":3,"branch":"iac","requires":["T06","G05"],"title":"Infrastructure validation in pull requests","explanation":"Formatting and validation catch some errors, while policy and plan review catch different risks. A passing check is not proof of a safe deployment.","task":"Add format/validation checks and attach a readable lab plan to your review process.","proof":"Explain one risk each check would miss.","resourceTitle":"Terraform tutorials","resourceUrl":"https://developer.hashicorp.com/terraform/tutorials","search":"Infrastructure validation in pull requests","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Cloud resources may cost money. Inspect the plan and pricing, use an owned lab, and clean up afterwards. Budget alerts are not spending caps.","sourceSection":"Infrastructure validation in pull requests"},{"id":"T09","level":3,"branch":"iac","requires":["N07","C05"],"title":"Ansible inventory and first playbook","explanation":"Ansible targets inventory hosts and applies modules remotely. Prefer a module's desired state to an opaque shell command when appropriate.","task":"Run a harmless playbook against an owned VM to install or inspect a package.","proof":"Show which host was targeted and what changed.","resourceTitle":"Ansible getting started","resourceUrl":"https://docs.ansible.com/ansible/latest/getting_started/index.html","search":"Ansible inventory and first playbook","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Cloud resources may cost money. Inspect the plan and pricing, use an owned lab, and clean up afterwards. Budget alerts are not spending caps.","sourceSection":"Ansible inventory and first playbook"},{"id":"T10","level":3,"branch":"iac","requires":["T09"],"title":"Templates, variables and handlers","explanation":"Templates generate configuration; handlers run when notified by changes. Variable precedence must remain understandable.","task":"Template a lab configuration and notify a service reload only when it changes.","proof":"Run twice and explain the second run's result.","resourceTitle":"Ansible getting started","resourceUrl":"https://docs.ansible.com/ansible/latest/getting_started/index.html","search":"Templates, variables and handlers","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Cloud resources may cost money. Inspect the plan and pricing, use an owned lab, and clean up afterwards. Budget alerts are not spending caps.","sourceSection":"Templates, variables and handlers"},{"id":"T11","level":3,"branch":"iac","requires":["T10","S01"],"title":"Roles, idempotency and Ansible secrets","explanation":"Roles organise repeatable configuration. Idempotency means reapplying converges without unnecessary change; secrets still need controlled storage.","task":"Package your playbook as a small role and document secret injection.","proof":"Demonstrate a no-change second run without exposing credentials.","resourceTitle":"Ansible getting started","resourceUrl":"https://docs.ansible.com/ansible/latest/getting_started/index.html","search":"Roles, idempotency and Ansible secrets","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Cloud resources may cost money. Inspect the plan and pricing, use an owned lab, and clean up afterwards. Budget alerts are not spending caps.","sourceSection":"Roles, idempotency and Ansible secrets"},{"id":"K01","level":3,"branch":"kube","requires":["D06","N01","C05"],"title":"Nodes, Pods and desired state","explanation":"Kubernetes reconciles declared state through controllers. A Pod is an execution unit; deleting one may cause its controller to replace it.","task":"Draw a node, Deployment, ReplicaSet and Pod relationship.","proof":"Explain who recreates a deleted managed Pod.","resourceTitle":"Kubernetes concepts","resourceUrl":"https://kubernetes.io/docs/concepts/","search":"Nodes, Pods and desired state","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Nodes, Pods and desired state"},{"id":"K02","level":3,"branch":"kube","requires":["K01"],"title":"Local cluster and Deployment manifest","explanation":"A local cluster is a learning environment, not evidence of operating production. Manifests identify resources and desired configuration.","task":"Create a kind or minikube lab and deploy your existing web image. Setup may need a continuation block.","proof":"Inspect the Deployment, Pod and actual running image.","resourceTitle":"Kubernetes tasks","resourceUrl":"https://kubernetes.io/docs/tasks/","search":"Local cluster and Deployment manifest","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Local cluster and Deployment manifest"},{"id":"K03","level":3,"branch":"kube","requires":["K02","N04","D02"],"title":"Services, selectors and port-forward","explanation":"A Service selects Pods through labels. targetPort must match the application listener; port-forward is a local access tool.","task":"Expose the lab workload through a Service and access it locally.","proof":"Break a selector, diagnose missing endpoints and fix it.","resourceTitle":"Kubernetes concepts","resourceUrl":"https://kubernetes.io/docs/concepts/","search":"Services, selectors and port-forward","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Services, selectors and port-forward"},{"id":"K04","level":3,"branch":"kube","requires":["K02","C05"],"title":"ConfigMaps and Secrets","explanation":"Configuration objects separate settings from images. Base64 encoding is not encryption, and secret access must be restricted.","task":"Inject a harmless setting and a synthetic secret into a lab Pod.","proof":"Explain how each reaches the process and who could read it.","resourceTitle":"Kubernetes concepts","resourceUrl":"https://kubernetes.io/docs/concepts/","search":"ConfigMaps and Secrets","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"ConfigMaps and Secrets"},{"id":"K05","level":3,"branch":"kube","requires":["K03","C04"],"title":"Readiness, liveness and startup probes","explanation":"Readiness controls traffic eligibility; liveness can trigger restart; startup probes protect slow initialization. Incorrect probes can create outages.","task":"Add readiness first, then a separately justified liveness check.","proof":"Explain traffic removal versus restart during a controlled failure.","resourceTitle":"Kubernetes concepts","resourceUrl":"https://kubernetes.io/docs/concepts/","search":"Readiness, liveness and startup probes","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Readiness, liveness and startup probes"},{"id":"K06","level":3,"branch":"kube","requires":["K02","D17"],"title":"Requests, limits and resource scheduling","explanation":"Requests influence scheduling; limits constrain runtime use. An unschedulable Pod is different from a running Pod killed for memory use.","task":"Apply small lab resource settings and inspect scheduling status.","proof":"Distinguish Pending due to capacity from OOMKilled.","resourceTitle":"Kubernetes concepts","resourceUrl":"https://kubernetes.io/docs/concepts/","search":"Requests, limits and resource scheduling","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Requests, limits and resource scheduling"},{"id":"K07","level":3,"branch":"kube","requires":["K02","D06"],"title":"kubectl logs, describe and events","explanation":"Pod state, events and logs answer different questions. Image-pull failures occur before the application can produce logs.","task":"Use an invalid image tag in a disposable Deployment and inspect events.","proof":"Diagnose and fix the tag using evidence.","resourceTitle":"Kubernetes tasks","resourceUrl":"https://kubernetes.io/docs/tasks/","search":"kubectl logs, describe and events","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"kubectl logs, describe and events"},{"id":"K08","level":3,"branch":"kube","requires":["K03","D16"],"title":"Rolling updates and rollout undo","explanation":"Deployment history can support rollback, but external configuration and database changes may not roll back with it.","task":"Roll out a new image, inspect status and undo the lab release.","proof":"Verify the served version after each stage.","resourceTitle":"Kubernetes tasks","resourceUrl":"https://kubernetes.io/docs/tasks/","search":"Rolling updates and rollout undo","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Rolling updates and rollout undo"},{"id":"K09","level":3,"branch":"kube","requires":["K02","D07"],"title":"Volumes and persistent volume claims","explanation":"A claim requests storage through cluster provisioning. Access modes and reclaim policies affect placement and data lifetime.","task":"Attach a small local-lab claim and recreate the consuming Pod.","proof":"Verify persistence and explain what deleting the claim may do.","resourceTitle":"Kubernetes concepts","resourceUrl":"https://kubernetes.io/docs/concepts/","search":"Volumes and persistent volume claims","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Volumes and persistent volume claims"},{"id":"K10","level":3,"branch":"kube","requires":["K02","L17"],"title":"Jobs, CronJobs and completion","explanation":"A Job tracks completion rather than a permanent service. Scheduled jobs need concurrency and retry choices.","task":"Run your health script as a lab Job and inspect completion/failure.","proof":"Explain retry behaviour and an overlapping schedule risk.","resourceTitle":"Kubernetes concepts","resourceUrl":"https://kubernetes.io/docs/concepts/","search":"Jobs, CronJobs and completion","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data.","sourceSection":"Jobs, CronJobs and completion"},{"id":"K11","level":4,"branch":"kube","requires":["K04","A03"],"title":"RBAC and service accounts","explanation":"Cluster API permissions are distinct from application network access. A service account should get only the operations its workload needs.","task":"Define a read-only lab Role and bind it to a service account.","proof":"Verify an allowed read and a denied write.","resourceTitle":"Kubernetes concepts","resourceUrl":"https://kubernetes.io/docs/concepts/","search":"RBAC and service accounts","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data. This node is an initial focused attempt; full validation may need multiple sessions.","sourceSection":"RBAC and service accounts"},{"id":"K12","level":4,"branch":"kube","requires":["K06","K07"],"title":"Scheduling, affinity, taints and disruption","explanation":"Placement and disruption controls shape where workloads run and how many can be unavailable. Conflicting constraints can prevent scheduling.","task":"Add a simple placement constraint and inspect a deliberately unschedulable Pod.","proof":"Explain which constraint prevented placement.","resourceTitle":"Kubernetes concepts","resourceUrl":"https://kubernetes.io/docs/concepts/","search":"Scheduling, affinity, taints and disruption","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data. This node is an initial focused attempt; full validation may need multiple sessions.","sourceSection":"Scheduling, affinity, taints and disruption"},{"id":"K13","level":4,"branch":"kube","requires":["K03","N13","N10"],"title":"Ingress and Gateway API routing","explanation":"External routing needs an implementation/controller as well as API objects. TLS termination and backend health remain operational responsibilities.","task":"Draw or configure one route in a local supported controller.","proof":"Trace a request from listener through route to Service and Pod.","resourceTitle":"Kubernetes concepts","resourceUrl":"https://kubernetes.io/docs/concepts/","search":"Ingress and Gateway API routing","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data. This node is an initial focused attempt; full validation may need multiple sessions.","sourceSection":"Ingress and Gateway API routing"},{"id":"K14","level":4,"branch":"kube","requires":["K03","N08"],"title":"CNI and network policies","explanation":"The network implementation determines supported policy behaviour. A policy object alone does not prove traffic bernetes tasks","resourceUrl":"https://kubernetes.io/docs/tasks/","search":"Cluster upgrades and control-plane recovery","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data. This node is an initial focused attempt; full validation may need multiple sessions.","sourceSection":"Cluster upgrades and control-plane recovery"},{"id":"K17","level":4,"branch":"kube","requires":["K06","O11"],"title":"HPA and cluster autoscaling","explanation":"Workload replica scaling and node scaling solve different capacity problems. Metrics, requests and warm-up times affect both.","task":"Simulate an increasing workload and trace the expected replica and node decisions.","proof":"Explain why increasing replicas can leave more Pods Pending.","resourceTitle":"Kubernetes concepts","resourceUrl":"https://kubernetes.io/docs/concepts/","search":"HPA and cluster autoscaling","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the result, then verify your prediction.","helpful":[],"lab":"Local disposable environment. Use synthetic data. This node is an initial focused attempt; full validation may need multiple sessions.","sourceSection":"HPA and cluster autoscaling"},{"id":"K18","level":4,"branch":"kube","requires":["K04","K08"],"title":"Helm and Kustomize","explanation":"Packaging and overlays reduce duplication but can hide generated behaviour. Inspect rendered manifests before applying them.","task":"Render a small Helm chart or Kustomize overlay for your lab service.","proof":"Explain the final image, resources and environment-specific changes.","resourceTitle":"Helm documentation","resourceUrl":"https://helm.sh/docs/","search":"Helm and Kustomize","optional":false,"minutes":30,"depth":"Practice","challenge":"Change one input or condition in the lab. Predict the re
